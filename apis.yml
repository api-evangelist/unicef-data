apis:
- name: UNICEF SDMX Data Warehouse API
  description: >
    The UNICEF SDMX REST API provides programmatic access to UNICEF's Data Warehouse Explorer, containing
    748+ indicators across thematic dataflows covering child health, nutrition, maternal and newborn health,
    HIV/AIDS, WASH, education, child protection, demography, and gender. Data spans all UN member states
    and is drawn from MICS, DHS, national surveys, and administrative sources. No authentication or API
    key is required. Supports SDMX-JSON, SDMX-XML (v2.0 and v2.1), and CSV output formats.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://data.unicef.org/sdmx-api-documentation/
  baseURL: https://sdmx.data.unicef.org/ws/public/sdmxapi/rest/
  tags:
