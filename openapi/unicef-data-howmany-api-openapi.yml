        locationCode:
          type: string
        attributes:
          type: array
          items:
            type: string
        dimensions:
          type: array
          items:
            type: string
        excludeDims_ms:
          type: array
          items:
            type: string
        source:
          type: string
        dataflow:
          type: string
        indicator:
          type: string
        indicatorName:
          type: string
        sdmx_dataquery:
          type: string
        score:
          type: number
          format: decimal
    SimpleIndicatorItem:
      type: object
      required:
      - score
      properties:
        id:
          type: string
        indicator:
          type: string
        indicatorName:
          type: string
        score:
          type: number
          format: decimal
