definitions:
  ContextLayer:
    required:
    - name
    type: object
    properties:
      id:
        title: ID
        type: integer
        readOnly: true
      modified_at:
        title: Modified at
        type: string
        readOnly: true
      created_at:
        title: Created at
        type: string
        readOnly: true
      category:
        title: Category
        type: string
        readOnly: true
      ogc_api:
        title: Ogc api
        type: string
        readOnly: true
      name:
        title: Name
        type: string
        maxLength: 512
        minLength: 1
      description:
        title: Description
        type: string
        x-nullable: true
      source:
        title: Source
        type: string
        maxLength: 512
        x-nullable: true
      layer_type:
        title: Layer type
        description: 'The type of layer for this context layer.<br>For <b>ArcGIS</b>, put feature server of REST. e.g : https://{host}/rest/services/{layer}/FeatureServer/1.<br>For <b>GeoJson</b>, put url of geojson.<br>For <b>Raster tile</b>, put XYZ url.<br>For <b>Raster COG</b>, put url of cog.<br>For <b>Related table</b>, select existing related table name.<br>For <b>Vector tile</b>, put XYZ url.<br>For <b>Cloud native gis layer</b>, select the layer from cloud native gis.'
        type: string
        enum:
        - ARCGIS
        - Geojson
        - Raster Tile
        - Raster COG
        - Vector Tile
        - Related Table
        - Cloud Native GIS Layer
      label_config:
        title: Label config
        type: object
        x-nullable: true
securityDefinitions:
  ApiKey Auth:
    type: apiKey
    in: header
    name: Authorization
