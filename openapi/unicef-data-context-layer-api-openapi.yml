              type: string
            type:
              title: Type
              description: The choices are ['ARCGIS', 'Geojson', 'Raster COG', 'Raster Tile', 'Vector Tile', 'Related Table', 'Cloud Native GIS Layer']
              type: string
            styles:
              title: Styles
              description: String of JSON containing style configuration. The styles are simply a list of layers in a Mapbox style.
              type: object
          example:
            name: Context Layer
            description: ''
            layer_type: Cloud Native GIS Layer
            category: Test
            styles:
            - id: '1'
              type: circle
              paint:
                circle-color: '#98F194'
                circle-radius: 6
                circle-opacity: 1
                circle-stroke-width: 1
              source: 00000000-0000-0000-0000-000000000000
              source-layer: default
            - id: '2'
              type: circle
              paint:
                circle-color: '#88005C'
                circle-radius: 6
                circle-opacity: 1
                circle-stroke-width: 1
              source: 00000000-0000-0000-0000-000000000000
              source-layer: default
      responses:
        '200':
          description: ''
          schema:
            description: Data that is needed to create/edit context layer.
            type: object
            properties:
              name:
                title: Name
                type: string
              description:
                title: Description
                type: string
              category:
