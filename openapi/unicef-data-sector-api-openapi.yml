openapi: 3.2.0
info:
  title: RDM Sector API
  description: Reference Data Manager API
  termsOfService: None
  contact:
    name: UNICEF
    url: https://data.unicef.org/
    email: data@unicef.org
  version: v2.0
servers:
- url: https://rdmapi.unicef.org
tags:
- name: Sector
paths:
  /api/sectors/agencies:
    get:
      tags:
      - Sector
      summary: Get the list of all agencies that contribute to RDM
      operationId: Sector_GetAgencies
      responses:
        '200':
          description: The list of all agencies that contribute to RDM, e.g. UNICEF, UNSD, WB
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CountryOrganization'
  /api/sectors:
    get:
      tags:
      - Sector
      summary: Get the list of all DAIU Technical Sectors
      operationId: Sector_GetSectors
      responses:
        '200':
          description: The list of all DAIU Technical Sectors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SectorItem'
  /api/sectors/domains:
    get:
      tags:
      - Sector
      summary: Get the list of all domains of DAIU Technical Sectors
      operationId: Sector_GetDomains
      responses:
        '200':
          description: The list of all domains of DAIU Technical Sectors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DomainItem'
  /api/sectors/subdomains:
    get:
      tags:
      - Sector
      summary: Get the list of all subdomains of DAIU Technical Sectors
      operationId: Sector_GetSubDomains
      responses:
        '200':
          description: The list of all subdomains of DAIU Technical Sectors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SubdomainItem'
components:
