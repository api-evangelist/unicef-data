          type: string
        editedBy:
          type: string
        editedDate:
          type: string
          format: date-time
        code:
          type: string
        indicator2Custodians:
          type: array
          items:
            $ref: '#/components/schemas/Indicator2Custodian'
        indicator2DataCompilers:
          type: array
          items:
            $ref: '#/components/schemas/Indicator2DataCompiler'
        indicator2DataProviders:
          type: array
          items:
            $ref: '#/components/schemas/Indicator2DataProvider'
        indicators:
          type: array
